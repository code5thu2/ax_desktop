[workspace]
members = [
    "crates/shared-types",
    "crates/win11-platform",
    "crates/mcp-core",
    "crates/skill-core",
    "apps/desktop"
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0"
ts-rs = { version = "10.1", features = ["serde-compat"] }
tauri = { version = "2.12.5" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tempfile = "3.14"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.dev]
debug = 1 # Chỉ sinh line-table symbols, tránh tạo file .pdb khổng lồ khi test/dev

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
