<!doctype html>
<html lang="en" class="app-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AX Desktop - AIPRO Super Studio</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #090A0F;
      }
      @keyframes splashBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 18px rgba(16,185,129,0.55)) drop-shadow(0 0 35px rgba(20,184,166,0.3));
        }
        50% {
          transform: scale(1.08);
          filter: drop-shadow(0 0 32px rgba(16,185,129,0.95)) drop-shadow(0 0 65px rgba(56,189,248,0.7));
        }
      }
      @keyframes splashAura {
        0%, 100% { opacity: 0.35; transform: scale(0.9); }
        50% { opacity: 0.85; transform: scale(1.3); }
      }
      @keyframes splashLaser {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(130%); }
        100% { transform: translateX(-100%); }
      }
    </style>
  </head>
  <body class="bg-background text-slate-100 min-h-screen antialiased overflow-hidden font-sans">
    <div id="app" class="h-screen w-screen flex flex-col">
      <!-- Instant Static Splash Preloader (Zero Black Screen) -->
      <div id="splash-preloader" style="position:fixed;inset:0;background:#090A0F;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f8fafc;user-select:none;">
        <div style="position:absolute;width:180px;height:180px;border-radius:9999px;background:radial-gradient(circle,rgba(16,185,129,0.35) 0%,rgba(20,184,166,0.2) 50%,transparent 70%);filter:blur(36px);animation:splashAura 2.6s ease-in-out infinite;"></div>
        <svg style="width:96px;height:96px;animation:splashBreathe 2.6s ease-in-out infinite;margin-bottom:24px;" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splash-grad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#10b981" />
              <stop offset="50%" stop-color="#14b8a6" />
              <stop offset="100%" stop-color="#38bdf8" />
            </linearGradient>
            <filter id="splash-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="1.5" result="blur" />
              <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
          </defs>
          <path d="M 32 8 L 52 19 L 52 45 L 32 56 L 12 45 L 12 19 Z" fill="url(#splash-grad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
          <path d="M 32 20 L 32 44 M 20 27 L 44 37 M 44 27 L 20 37" stroke="#ffffff" stroke-width="2" stroke-linecap="round" filter="url(#splash-glow)" />
        </svg>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <span style="font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#ffffff;">AX Desktop</span>
          <span style="display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:9px;font-weight:700;letter-spacing:0.5px;padding:3px 8px;border-radius:9999px;background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.4);font-family:monospace;text-align:center;">AIPRO SUPER STUDIO</span>
        </div>
        <div style="font-size:12px;color:#94a3b8;margin-bottom:20px;letter-spacing:0.3px;">Skill Marketplace • MCP Protocol Studio</div>
        <div style="width:260px;height:4px;border-radius:9999px;background:rgba(255,255,255,0.08);overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;bottom:0;width:120px;border-radius:9999px;background:linear-gradient(to right,transparent,#10b981,#38bdf8);animation:splashLaser 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
