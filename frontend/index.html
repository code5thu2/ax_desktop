<!doctype html>
<html lang="en" class="app-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Protocol Studio</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #090A0F;
      }
      @keyframes splashBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 18px rgba(99,102,241,0.55)) drop-shadow(0 0 35px rgba(56,189,248,0.25));
        }
        50% {
          transform: scale(1.09);
          filter: drop-shadow(0 0 34px rgba(99,102,241,0.95)) drop-shadow(0 0 70px rgba(168,85,247,0.7));
        }
      }
      @keyframes splashAura {
        0%, 100% { opacity: 0.35; transform: scale(0.9); }
        50% { opacity: 0.9; transform: scale(1.35); }
      }
      @keyframes splashLaser {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(130%); }
        100% { transform: translateX(-100%); }
      }
    </style>
  </head>
  <body class="bg-background text-slate-100 min-h-screen antialiased overflow-hidden font-sans">
    <div id="app" class="h-screen w-screen flex flex-col">
      <!-- Instant Static Splash Preloader (Zero Black Screen) -->
      <div id="splash-preloader" style="position:fixed;inset:0;background:#090A0F;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#f8fafc;user-select:none;">
        <div style="position:absolute;width:160px;height:160px;border-radius:9999px;background:radial-gradient(circle,rgba(99,102,241,0.45) 0%,rgba(124,58,237,0.25) 50%,transparent 70%);filter:blur(32px);animation:splashAura 2.6s ease-in-out infinite;"></div>
        <svg style="width:100px;height:100px;animation:splashBreathe 2.6s ease-in-out infinite;margin-bottom:28px;" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splash-grad" x1="32" y1="8" x2="32" y2="54" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="35%" stop-color="#6366f1" />
              <stop offset="100%" stop-color="#7c3aed" />
            </linearGradient>
            <filter id="splash-star" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="1.2" result="blur" />
              <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
          </defs>
          <path d="M 32 8 C 35 8 38 11 40 15 L 53 43 C 55 47.5 53 52 48.5 53.5 C 45 54.5 39 50 32 46 C 25 50 19 54.5 15.5 53.5 C 11 52 9 47.5 11 43 L 24 15 C 26 11 29 8 32 8 Z" fill="url(#splash-grad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" />
          <path d="M 32 19 C 32 25.5 34.5 28 41 28 C 34.5 28 32 30.5 32 37 C 32 30.5 29.5 28 23 28 C 29.5 28 32 25.5 32 19 Z" fill="#ffffff" filter="url(#splash-star)" />
        </svg>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <span style="font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#ffffff;">MCP PROTOCOL STUDIO</span>
          <span style="display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:9px;font-weight:700;letter-spacing:0.5px;padding:3px 8px;border-radius:9999px;background:rgba(16,163,127,0.15);color:#10A37F;border:1px solid rgba(16,163,127,0.4);font-family:monospace;text-align:center;">ENTERPRISE</span>
        </div>
        <div style="font-size:13px;color:#94a3b8;margin-bottom:24px;">Đang khởi tạo MCP Protocol Studio...</div>
        <div style="width:260px;height:4px;border-radius:9999px;background:rgba(255,255,255,0.08);overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;bottom:0;width:120px;border-radius:9999px;background:linear-gradient(to right,transparent,#8b5cf6,#38bdf8);animation:splashLaser 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
        </div>
      </div>
    </div>
    <script>
      // Immediately notify native desktop host to show window once splash HTML is painted
      window.addEventListener('pywebviewready', function () {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.show_window) {
          window.pywebview.api.show_window();
        }
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
