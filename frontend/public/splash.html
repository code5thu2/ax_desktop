<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MCP Protocol Studio Splash</title>
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #111217;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        user-select: none;
      }
      .splash-card {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 36%, rgba(99, 102, 241, 0.22) 0%, rgba(30, 27, 75, 0.15) 45%, #111217 75%), #111217;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 25px 60px rgba(0, 0, 0, 0.9);
      }
      .content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      @keyframes logoBreathe {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 18px rgba(99, 102, 241, 0.6)) drop-shadow(0 0 35px rgba(56, 189, 248, 0.3));
        }
        50% {
          transform: scale(1.08);
          filter: drop-shadow(0 0 32px rgba(99, 102, 241, 0.95)) drop-shadow(0 0 65px rgba(168, 85, 247, 0.7)) drop-shadow(0 0 85px rgba(56, 189, 248, 0.45));
        }
      }
      @keyframes auraBreathe {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 0.85; transform: scale(1.3); }
      }
      .ambient-aura {
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, rgba(124, 58, 237, 0.25) 50%, transparent 70%);
        filter: blur(36px);
        animation: auraBreathe 2.6s ease-in-out infinite;
        pointer-events: none;
      }
      .logo-svg {
        width: 96px;
        height: 96px;
        animation: logoBreathe 2.6s ease-in-out infinite;
        margin-bottom: 22px;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .title-text {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 45%, #c4b5fd 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 4px 8px;
        border-radius: 9999px;
        background: rgba(46, 16, 101, 0.85);
        color: #c4b5fd;
        border: 1px solid rgba(139, 92, 246, 0.45);
        font-family: 'JetBrains Mono', monospace;
        text-align: center;
      }
      .status-text {
        font-size: 13px;
        color: #94a3b8;
        font-weight: 500;
        height: 20px;
        margin-bottom: 20px;
        transition: opacity 0.2s ease, color 0.2s ease;
      }
      .status-text.waiting {
        color: #c4b5fd;
      }
      .progress-container {
        width: 330px;
        height: 4px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        margin-bottom: 8px;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #38bdf8 0%, #6366f1 50%, #a855f7 100%);
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.85);
        transition: width 0.08s linear;
      }
      .percent-text {
        font-size: 11px;
        font-family: 'JetBrains Mono', monospace;
        color: #64748b;
        letter-spacing: 0.5px;
      }
      .footer-row {
        position: absolute;
        bottom: 14px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: #475569;
        font-family: 'JetBrains Mono', monospace;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="splash-card pywebview-drag-region">
      <div class="ambient-aura"></div>
      <div class="content">
        <!-- AI Pro Logo Emblem -->
        <svg class="logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splash-grad" x1="32" y1="8" x2="32" y2="54" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="35%" stop-color="#6366f1" />
              <stop offset="100%" stop-color="#7c3aed" />
            </linearGradient>
            <filter id="splash-star" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="1.2" result="blur" />
              <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
          </defs>
          <path d="M 32 8 C 35 8 38 11 40 15 L 53 43 C 55 47.5 53 52 48.5 53.5 C 45 54.5 39 50 32 46 C 25 50 19 54.5 15.5 53.5 C 11 52 9 47.5 11 43 L 24 15 C 26 11 29 8 32 8 Z" fill="url(#splash-grad)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.2" />
          <path d="M 32 19 C 32 25.5 34.5 28 41 28 C 34.5 28 32 30.5 32 37 C 32 30.5 29.5 28 23 28 C 29.5 28 32 25.5 32 19 Z" fill="#ffffff" filter="url(#splash-star)" />
        </svg>

        <div class="title-row">
          <span class="title-text">MCP PROTOCOL STUDIO</span>
          <span class="badge">ENTERPRISE</span>
        </div>

        <div id="status" class="status-text">Đang khởi tạo MCP Gateway & Registry Server...</div>

        <div class="progress-container">
          <div id="bar" class="progress-bar"></div>
        </div>

        <div id="percent" class="percent-text">0%</div>
      </div>

      <div class="footer-row">
        <span>MCP Protocol Native v1.0.0 • Enterprise Edition</span>
        <span>IntelliJ Core Engine</span>
      </div>
    </div>

    <script>
      (function() {
        var baseDuration = 2700; // Time to reach ~92% (approx 2.7s)
        var startTime = Date.now();
        var bar = document.getElementById('bar');
        var percentEl = document.getElementById('percent');
        var statusEl = document.getElementById('status');

        var steps = [
          { at: 0, text: 'Đang khởi tạo môi trường AI Studio...' },
          { at: 25, text: 'Đang tải cấu hình mô hình & bộ công cụ chuyên dụng...' },
          { at: 60, text: 'Đang chuẩn bị không gian làm việc an toàn...' }
        ];

        var phase = 'progressing'; // 'progressing' | 'waiting_main' | 'completing' | 'done'

        function checkMainAppReady(callback) {
          if (window.pywebview && window.pywebview.api && window.pywebview.api.is_main_ready) {
            window.pywebview.api.is_main_ready().then(function(ready) {
              callback(Boolean(ready));
            }).catch(function() {
              callback(true);
            });
          } else {
            callback(true);
          }
        }

        function triggerCompletion() {
          if (phase === 'completing' || phase === 'done') return;
          phase = 'completing';
          statusEl.className = 'status-text';
          statusEl.innerText = 'Khởi động hoàn tất! Đang mở ứng dụng...';
          bar.style.width = '100%';
          percentEl.innerText = '100%';

          setTimeout(function() {
            phase = 'done';
            function notifyDone() {
              if (window.pywebview && window.pywebview.api && window.pywebview.api.on_splash_done) {
                window.pywebview.api.on_splash_done();
              } else {
                setTimeout(notifyDone, 100);
              }
            }
            notifyDone();
          }, 250);
        }

        function waitForMainApp() {
          phase = 'waiting_main';
          statusEl.className = 'status-text waiting';
          statusEl.innerText = 'Đang đợi ứng dụng chính khởi động xong...';

          checkMainAppReady(function(ready) {
            if (ready) {
              triggerCompletion();
            } else {
              setTimeout(waitForMainApp, 150);
            }
          });
        }

        function tick() {
          if (phase !== 'progressing') return;

          var elapsed = Date.now() - startTime;
          // Progress smoothly up to 92%
          var p = Math.min(92, Math.floor((elapsed / baseDuration) * 92));

          bar.style.width = p + '%';
          percentEl.innerText = p + '%';

          for (var i = steps.length - 1; i >= 0; i--) {
            if (p >= steps[i].at) {
              if (statusEl.innerText !== steps[i].text) {
                statusEl.innerText = steps[i].text;
              }
              break;
            }
          }

          if (elapsed >= baseDuration || p >= 92) {
            // Check if real main app is actually ready
            checkMainAppReady(function(ready) {
              if (ready) {
                triggerCompletion();
              } else {
                waitForMainApp();
              }
            });
          } else {
            requestAnimationFrame(tick);
          }
        }

        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
